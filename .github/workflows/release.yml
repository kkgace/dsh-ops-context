name: Release

on:
  push:
    tags: ['V*']

permissions:
  contents: write

jobs:
  # Gate the release on the full cross-platform test matrix: the tag's tgz
  # is only published after the exact tagged code passes on all three OS.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pack plugin
        run: |
          mkdir -p packages
          npm pack --ignore-scripts --pack-destination packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            DSH Host plugin **dsh-ops-context** — bounded context tools (`context_search` / `context_read`) for DSH web & desktop, cross-platform (Linux / macOS / Windows).

            Highlights (see `RELEASE-NOTES.md` and `docs/` for full measured benchmarks):
            - Per-call context cap: worst case 135,538 → 455 tokens (298:1)
            - Full-scan self-attestation + same-line occurrence aggregation
            - Credential paths: name-visible, content always blocked
            - Same-turn read dedup (measured 52.5% saving)
            - **Cross-platform**: workspace root is treated as an opaque prefix — Windows drive roots (`C:\...`) are accepted. One tgz, no native deps.
            - Same test suite vs 0.1.1: task-level tokens 442,228 → 37,419 (−91.5%), calls 26 → 5

            Install (web/desktop use the same mechanism):
            `dsh plugin --profile web install ./dsh-ops-context-0.5.0.tgz`
            Requires DSH >=0.2.0-rc.2, restart to take effect.
          files: |
            packages/*.tgz
